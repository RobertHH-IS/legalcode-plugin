name: Agent Plugins conformance

on:
  push:
    branches:
      - main
    paths:
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/agent-plugins-conformance.yml"
      - "plugins/**"
      - "requirements-dev.txt"
      - "scripts/validate_agent_plugins.py"
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/agent-plugins-conformance.yml"
      - "plugins/**"
      - "requirements-dev.txt"
      - "scripts/validate_agent_plugins.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate Agent Plugins packages
        run: python scripts/validate_agent_plugins.py
